# Trading 212 instrument rules — copy to ~/.config/cfdinvest/t212_rules.toml
# and fill in from what the ticket shows you.
#
# Every instrument in the configured universe is stubbed below, grouped by
# asset class, with each field commented out. Uncomment what you read in the
# app and leave the rest alone.
#
# NOTHING HERE IS FILLED IN, AND THAT IS DELIBERATE
# -------------------------------------------------
# Nothing publishes a machine-readable table of Trading 212's instrument
# rules and this project makes no broker API calls, so an invented table
# would be the worst of both worlds: numbers that look measured, are not, and
# get trusted because they sit beside numbers that are.
#
# An instrument you have not recorded is reported *unverified*, never
# compliant. Every check returns "not checked" rather than "passed". A
# partial entry is better than none: it makes the checks it covers real and
# leaves the rest honestly unchecked.
#
# ON LEVERAGE
# -----------
# Trading 212 applies leverage automatically and it differs by asset class,
# so each group below carries the FCA/ESMA **regulatory retail ceiling**.
#
# That ceiling is NOT Trading 212's figure. It is the most a retail account
# may be given, so use it as a sanity check on what you read:
#
#   * a figure ABOVE the ceiling means the account is classified
#     professional — worth knowing before you size anything
#   * a figure BELOW it is perfectly ordinary; brokers routinely offer less
#
# The number that goes in `leverage` is the one the ticket shows you for that
# instrument. Nothing else is a measurement.
#
# Generated for the 41-instrument universe in config/config.toml.
# Regenerate after changing that list so the stubs cannot drift from it.



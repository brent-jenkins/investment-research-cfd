# cfdinvest configuration
#
# Resolution order (later wins):
#   dataclass defaults  ->  this file  ->  environment (CFD_* / FRED_API_KEY)
#
# Point at a different file with $CFD_CONFIG_FILE.
# NEVER put the FRED API key here: it belongs in .env / the environment.

[paths]
# Root of the data lake. Relative paths resolve against the working directory;
# absolute paths (or $CFD_DATA_ROOT) are recommended for scheduled runs.
data_root = "data"

[market]
# The CFD universe: 43 instruments across indices, commodities, FX and
# single stocks. Every tradable entry corresponds to a Trading 212 CFD --
# cfdinvest/livehelper/t212_instruments.py names the match for each, and the
# signal layer holds anything unmatched flat.
#
# Two notes on how this list was chosen.
#
# These are the *indices and commodities themselves*, not ETFs that track
# them. SPY and Trading 212's US 500 both follow the S&P 500, but modelling
# an ETF and trading an index CFD are different things. ^GSPC is what the
# CFD is priced on.
#
# The single stocks were picked for liquidity, volatility and sector spread
# -- not for having gone up or down. A universe assembled from what already
# worked is fitted to the past, and every backtest over it flatters itself.
# The strategy trades both directions and the signal decides which; the job
# of this list is to offer instruments that *trend*, in enough different
# markets that they do not all turn at once.
# ONE TRADING SESSION, deliberately.
#
# Everything here trades 14:30-21:00 UTC. That is a constraint of the bar
# interval below, not a view about which markets are interesting.
#
# The analysis layer builds one matrix indexed by every timestamp across
# every instrument. On daily bars that is nearly dense -- one bar a day,
# roughly aligned. On hourly bars it is mostly holes, because FX trades
# around the clock, the Nikkei trades overnight and the FTSE closes before
# New York opens: each instrument is absent from about four rows in five.
# Rolling windows over a column that is 80% NaN return NaN, so conviction
# cannot be computed and every signal collapses to flat. Measured on the
# full forty-one at 1h: returns 19% populated, realised volatility 0.3%,
# and exactly zero active signals across 16,026 bars.
#
# Restricting to one session makes the panel dense again -- returns 100%,
# volatility 99.4% -- and the signals come back. Restoring FX, commodities
# and the European and Asian indices to intraday needs per-session panels
# in the preprocessing layer, which is real work and not yet done.
# Individual stocks only, and that is the objective rather than a leftover.
#
# Every source of non-price evidence this system has -- EDGAR filings,
# earnings dates, company news, sentiment -- exists for companies and cannot
# exist for an index. An index can only ever be traded on price, which is
# the one thing the trend engine already knows. Narrowing to stocks aligns
# the universe with the evidence available about it.
#
# The measurement agrees, and more strongly than expected. Over two years on
# hourly bars, at 2bp slippage:
#
#   universe               n    CAGR   max drawdown   Sharpe
#   shares + US indices   22   81.3%        -19.0%     1.97
#   shares only           19  126.7%        -19.6%     2.57
#   US indices only        3   -3.7%        -17.4%    -0.21
#
# The three indices lost money on their own and ranked 13th, 17th and 19th
# of twenty-two, contributing 7.6% of the gross while taking 14% of the
# universe. Under a gross exposure cap that is not neutral: capital in an
# index is capital not in a better position, which is why removing them
# raises the return rather than merely leaving it alone.
#
# Deliberately small. Twenty or thirty is the ceiling being considered, not
# a target -- a tight universe is what makes it possible to hold detailed
# data on each name, watch its filings and read its news, and a wider one
# would be monitored more thinly rather than more thoroughly.
#
# Eight names since 2026-08-28, down from nineteen. Sweeping the count with
# sector ignored gives a monotone curve on daily bars over the 49-name pool:
# 46.7% CAGR at six names, 40.3 at eight, 28.5 at ten, 25.1 at twelve, 21.2
# at sixteen, then flat near 10 from twenty out to thirty. Risk-adjusted it
# peaks at eight, 1.46 return-per-drawdown against 0.51 at thirty. Monotone
# is why this is believed: the same sweep pushed past its range is what
# exposed the sector cap and the 25% weight cap as wiggles.
#
# The gain is selection and not the pool. Against the same engine run over
# every eligible name with no screen at all -- both arms carrying the
# identical forty-nine names, so identical hindsight -- eight names is worth
# +1.06 return-per-drawdown. An excess measured against a yardstick that
# inherits the same bias cannot be that bias.
#
# The cost is concentration: drawdown deepens from -20.3% at thirty names to
# -27.7% at eight, and the engine's only backstop is the 20% per-instrument
# cap. Accepted deliberately rather than overlooked.
#
# Measured on daily bars, which is the related strategy and not the hourly
# one that deals. This is a forward test on a demo account, not a proof.
tickers = [
    "AMD", "TSLA", "NVDA", "ORCL", "MSFT", "AVGO", "META", "AMZN",
    # These are the screen's top eight *after* three names are held out by
    # hand, under the weighting in force when they were chosen. Ranked
    # without the overrides it read MU, AMD, INTC, TSLA, PLTR, NVDA, ORCL,
    # MSFT, and the overrides are why it did not.
    #
    # The screen was re-weighted towards volatility later the same day and
    # this list deliberately does NOT follow it yet. Under 0.20/0.70/0.10
    # the top eight would swap in COIN, MRNA, QCOM and SMCI, and SMCI trades
    # at 41.61bp -- 4.20x the universe median. That is not a coincidence to
    # be worked around: ranking harder on volatility pulls in volatile
    # names, volatile names are dear, and the cost exclusion that would
    # answer it does not exist in production yet.
    #
    # It cannot be built usefully today either. Candidate spread readings
    # began on 2026-08-28 and the usability floor is 25 of them, so the rule
    # has roughly a month before it has anything to stand on. Until then the
    # ranking is better than the list it would produce, and the list waits.
    #
    # MU and PLTR are held out for survivorship. MU's $42bn turnover is
    # largely an +855% two-year run showing up in price x volume; PLTR rose
    # roughly tenfold across the test window and is in the candidate pool
    # only because that pool was assembled in 2026 knowing it had. The
    # screen ranks on liquidity, liquidity is price x volume, and price x
    # volume rewards whatever went up most -- so concentrating into the top
    # of this ranking concentrates into the pool's hindsight. That is the
    # cost of a pool chosen after the fact, and it bites hardest exactly
    # when the book is tightened. It wants a wider, mechanically-defined
    # universe, which is ingestion work rather than analysis.
    #
    # INTC is held out by the owner's decision of 2026-08-28, and the
    # reasoning behind that decision has since been shown to be
    # time-dependent. Its core-session spread by year: 11.88bp in 2023
    # (0.85x the universe median), 35.94bp in 2024 (3.63x), 47.38bp in 2025
    # (5.02x), 14.00bp in 2026 (1.45x). The 28.73bp on file is a
    # whole-history median dominated by 2024-25. INTC was genuinely dear
    # then and is close to ordinary now, so a trailing cost rule would
    # readmit it today at 1.18x on ninety days. A static ban is itself a
    # hindsight artefact; this one stays only until the trailing rule
    # exists to replace it.
    #
    # Also dropped here, purely for ranking below eighth: AAPL, ADBE, CAT,
    # COST, GOOGL, JNJ, JPM, LULU, NFLX, NKE, XOM. CAT was added on
    # 2026-08-27 as a deliberate non-technology pick when twelve of nineteen
    # were technology; the sector cap that motivated it was removed the
    # following day, having been measured to buy nothing, so the reason for
    # holding CAT against its rank went with it.
]
# Hourly, not daily.
#
# A CFD held for days pays financing that was 72% of every cost in the
# backtest, and a daily bar offers one decision per instrument per session
# -- the position is chosen once and then only watched. Measured over two
# years on the list above, against the same costs and the same engine:
#
#                  trips/yr   win%   %/trip   total%   hours held
#   daily               347   56.9    0.798    553.8        169.1
#   hourly, 7h stop   1,626   53.8    0.238    773.6         22.1
#
# Lower per trip, higher in total, and the mechanism is the holding period:
# 22 hours against 169 pays a fraction of the carry. At confidence >= 0.60
# the win rate goes from 61.8% to 75.3%.
#
# Finer intervals are available from the vendor but not usable: 15m and 5m
# carry only ~85 days of history, which is too little to validate against.
# Hourly is the shortest bar with two years behind it.
interval = "1h"          # "1d", "1h" or "1wk"
start = "2005-01-01"
# end = "2025-01-01"     # omit for "up to now"
auto_adjust = true       # split/dividend-adjusted OHLC
include_actions = true   # also store dividends and splits
batch_size = 25          # tickers per yfinance request
threads = 8
refetch_overlap_days = 5 # re-read recent bars to pick up vendor revisions

[macro]
# FRED series driving the macro-regime classifier.
series_ids = [
    "DGS10",      # 10Y Treasury constant maturity
    "DGS2",       # 2Y Treasury
    "T10Y2Y",     # 10Y-2Y term spread (recession signal)
    "T10Y3M",     # 10Y-3M term spread
    "DFF",        # Effective fed funds rate
    "VIXCLS",     # CBOE volatility index
    "BAMLH0A0HYM2",  # ICE BofA US high-yield OAS (credit stress)
    "CPIAUCSL",   # CPI, all urban consumers
    "UNRATE",     # Unemployment rate
    "INDPRO",     # Industrial production
    "USREC",      # NBER recession indicator
    "DTWEXBGS",   # Trade-weighted USD index
]
observation_start = "1990-01-01"

# How the series are sourced with respect to revisions. One of:
#
#   "publication_lag"  DEFAULT. Every observation carries a real publication
#                      date, obtained the best way available for that series:
#                      FRED's first prints where it serves them, otherwise the
#                      latest values stamped observation_date + release lag.
#                      Safe as a global default because only high-vintage
#                      DAILY series ever take the fallback, and those are not
#                      revised.
#
#   "initial_release"  strictly first prints. Falls back to publication_lag
#                      when FRED refuses the vintage span, and warns loudly.
#
#   "latest"           newest revision of every observation. Look-ahead
#                      biased: 2008 GDP as restated today is not what a trader
#                      saw in 2008. Opt in deliberately.
#
#   "vintage"          ALFRED snapshot as of a fixed date. Requires
#                      realtime_start / realtime_end below, which are sent to
#                      FRED exactly as written here.
#
# Leave unset to derive: "vintage" if realtime bounds are set, else
# "publication_lag". The mode ACTUALLY used (after any fallback) is recorded
# per series in data/metadata/macro_manifest.json and readable via
# DataRepository.macro_vintage_mode(). Modes are never mixed inside one file
# -- changing one requires ingest(allow_mode_change=True), which replaces it.
# vintage_mode = "publication_lag"

# Publication lag applied when first prints are unavailable and a synthetic
# publication date must be derived. 1 day suits daily rate series, which are
# the only ones that ever fall back.
fallback_release_lag_days = 1

# realtime_start = "2020-04-01"
# realtime_end   = "2020-04-01"
refetch_overlap_days = 45   # macro prints are revised for months
max_workers = 6
min_request_interval = 0.55 # FRED allows 120 requests/minute
fetch_metadata = true

# --- Per-series overrides -------------------------------------------------
# Any macro setting can be pinned for a single series. Sub-tables must come
# after every plain key in [macro] above.
#
# Daily rate series are never revised, so latest costs nothing and skips the
# fallback round-trip entirely:
#
# [macro.series_overrides.DGS10]
# vintage_mode = "latest"
# release_lag_days = 1
#
# [macro.series_overrides.T10Y2Y]
# vintage_mode = "latest"

[network]
timeout = 30.0
max_retries = 4
backoff_base = 1.5
backoff_cap = 30.0

[storage]
compression = "zstd"        # "zstd", "snappy", "gzip" or "none"
row_group_size = 100000

[logging]
level = "INFO"
# log_file = "logs/cfdinvest.log"

# --------------------------------------------------------------------------- #
# What the system does
#
# Everything above this line is plumbing: where the lake lives, how to talk to
# the vendors, how to store what comes back. None of it changes a trading
# decision. Everything below does.
#
# These lived as dataclass defaults across three modules until 2026-08-26. The
# problem with that is not untidiness: changing one means editing Python and
# restarting a service, and a long-running daemon goes on executing the modules
# it imported at start-up. FX conversion was switched on in the code and stayed
# off in production for eleven hours because of exactly that. A value read from
# this file on each run cannot fail that way, and the run records what it used.
#
# The values here reproduce the behaviour recorded before the section existed.
# The commented figures are what testing preferred; they are not enabled,
# because a strategy change should be a decision rather than a default.
# --------------------------------------------------------------------------- #
[strategy]

# "gate" permits or forbids a direction; "tilt" scales size by how favourable
# the regime is. Tilting returned -40.9% against the gate's -54.7% over the
# full history, and the ordering carries real information -- flattening the
# tilts entirely gave -82.5%.
regime_mode = "tilt"          # was "gate"; tilting returned -40.9% against -54.7%

# Whether a flat signal closes an open position. Reading flat as "no view"
# rather than "get out" quadrupled gross P&L.
exit_on_flat = false          # was true; reading flat as "no view" quadrupled gross P&L
exit_on_opposing_signal = false

# Close a position that is still behind after this long, financing deducted.
# In days, so a fraction is a part-session: 0.29 is seven hours, which on
# hourly bars is one US cash session.
#
# It was 1 day, chosen on daily bars where 73% of eventual losers were
# already behind on day one against 29% of eventual winners. The same idea
# at the new bar size, re-measured over two years on this universe:
#
#   stop      trips/yr   win%   total%   hours held
#   1 day          484   48.3    247.3         50.1
#   7 hours      1,626   53.8    773.6         22.1
#
# Carrying a daily stop onto hourly bars is the worst of both -- it keeps
# the carry and gives up the extra decisions. Left at one session because
# shorter stops measured no better and appear to clamp: 3-hour and 1-hour
# stops returned byte-identical results, which is a floor in the engine
# rather than a finding, and not something to tune against until it is
# understood.
time_stop_days = 0.29         # one US session; 773.6% against 247.3% at 1 day

# Days an instrument is left alone after a position in it closes.
#
# Two hours, and it is close to a formality. The fourteen-day figure came
# from daily bars and seven-day holds, and until now it was never tested
# against anything: the engine stamped the close *before* the time stop ran,
# so a time-stop exit recorded no close at all and the cooldown never
# applied to it -- which, in a configuration where the time stop is the
# usual exit, meant no cooldown at all whatever the file said.
#
# Measured properly for the first time, holding the stop at 0.29d:
#
#   cooldown    0h     2h     6h     1d     2d     7d
#   CAGR     154.9  155.6  116.3   86.5  160.8  100.9
#
# That is not a relationship. It rises, falls, collapses and recovers with
# no coherent shape, and the two-day peak has an eighty-seven per cent
# trough immediately beside it -- choosing it would be fitting the wiggle.
# The honest reading is that on this bar size the cooldown earns nothing.
#
# Two hours rather than zero only to stop an instrument being re-entered on
# the bar after it was stopped out, which is churn rather than a decision.
# Between zero and two hours the measurement cannot tell the difference, and
# this comment should not pretend otherwise.
reentry_cooldown_days = 0.083 # two hours; the multi-day version measured as noise

# Relative drift before an open position is resized. At 3.0 and above, drift
# rebalancing is off entirely and only opens and closes remain.
rebalance_threshold = 3.0     # was 0.25; drift rebalancing off entirely

# Confidence a signal needs to open a position, and the level below which an
# open one is closed. The gap between them is hysteresis: it stops a position
# being churned by a confidence reading wobbling across a single line.
#
# This is the strategy's real entry bar, and until now it lived only as a
# dataclass default -- no configuration file named the number the engine
# traded on. The paper book's arms were then chosen as round numbers
# (0.50/0.60/0.70) without anyone checking against it, so the forward record
# was validating a configuration measurably worse than the one being
# backtested. Measured over two years on hourly bars:
#
#   entry bar   0.00    0.35    0.40    0.50    0.60    0.70    0.80
#   CAGR      103.6%  126.7%  121.4%   85.6%   71.6%   67.7%   52.3%
#
# 0.35 is the peak, and walk-forward across 18 out-of-sample months says to
# leave it alone: re-fitting it on a rolling six-month window lost to the
# fixed value in 17 of 18 windows.
entry_confidence = 0.35
exit_confidence = 0.20

# Execution friction beyond the spread, in basis points of price. The spread
# is charged separately; this is what the quote moves between deciding and
# filling.
#
# It was zero, which on a book turning over ~15,000 times in two years is
# the most flattering assumption in the whole backtest -- and the live
# daemon acts up to fifteen minutes after an hourly bar closes, which the
# backtest does not model at all.
#
#   slippage    0bp    0.5bp   1bp     2bp     5bp     10bp
#   CAGR      155.6%  135.1%  113.8%   81.3%    9.4%  -52.4%
#
# Break-even against buy-and-hold (22.4% a year) is near 4bp. 2.0 is the
# cautious end of what a £1,000 retail order should suffer at a broker's own
# quote, and the point of setting it is to stop the backtest flattering
# itself rather than to model any measured figure -- nobody has measured
# this, because no order has ever been placed.
slippage_bps = 2.0

# Gross notional the book may carry, as a multiple of equity -- the margin
# dial. Trading 212 gives 5x on shares, so gross exposure of G times equity
# commits about G/5 of the account as margin.
#
# This was never passed through from the configuration at all: the execution
# default of 5.0 applied, which is 100% of the balance committed as margin,
# by omission rather than by choice. Measured over two years on hourly bars:
#
#   max_leverage   margin   CAGR    max drawdown   Sharpe
#          5.0      100%   374.4%        -21.5%     3.37
#          2.5       50%   121.4%        -18.4%     2.60
#          1.5       30%    87.6%        -11.1%     3.06
#          1.0       20%    53.9%         -8.6%     2.91
#
# 2.5 because a book at full margin has no room for an adverse move before
# the broker closes it, and because the return that comes with it is gearing
# rather than edge -- the strategy beats buy-and-hold of the same universe
# (22.4% a year, -23.9% drawdown) at every setting on this table.
max_leverage = 3.5
#
# Raised from 2.5 on 2026-08-28. The table above was measured on the two-year
# yfinance window, the one that excludes 2023 -- the same artefact as the
# 139.8% headline -- so it was not evidence for anything. Re-measured on
# Capital's 3.65 years with drift rebalancing on and the concentration cap
# applied:
#
#   max_leverage   margin   CAGR    max drawdown   CAGR/DD
#          2.5       50%    49.1%        -32.6%      1.51
#          3.0       60%    56.8%        -38.8%      1.46
#          3.5       70%    69.6%        -34.6%      2.01
#          4.0       80%    64.7%        -45.2%      1.43
#          5.0      100%    66.6%        -53.4%      1.25
#
# 3.5 is the peak on both return and risk-adjusted return. Above it the
# return flattens while the drawdown deteriorates sharply, which is gearing
# rather than edge.
#
# Capital's margin factor is fixed at 20%, so this commits 70% of the account
# and a call arrives once equity has fallen 30%. That is only survivable
# because of the cap below: at 3.5x with no concentration limit, one name
# gapping 8.6% is a margin call.

# The largest share of the gross ceiling any one instrument may take.
#
# The bridge has enforced this since it was written; the engine never did,
# so every backtest figure before 2026-08-28 was measured on a book that
# could put everything into one name. It matters because the book is thin
# far more often than it looks: over 3.65 years it holds a single name on
# 17.3% of bars and two or fewer on 30.3%.
#
# Capping it improves the return as well as the drawdown, which is not what
# a diversification constraint usually does -- this strategy's concentrated
# positions are its worse bets:
#
#   concentration   CAGR    max drawdown   CAGR/DD   calls on a gap of
#          none     63.5%       -37.9%       1.68           8.6%
#          0.40     62.6%       -41.0%       1.52          21.4%
#          0.25     66.6%       -38.5%       1.73          34.3%
#          0.20     69.6%       -34.6%       2.01          42.9%
#          0.15     67.6%       -35.9%       1.88          57.1%
#
# 0.20 rather than 0.15 because the improvement has flattened by then and
# the tighter cap starts leaving the account under-invested when few names
# qualify. Read by the engine and by `RiskLimits.for_balance`, from here
# and nowhere else -- it was a default argument in two places, which is how
# two copies of a limit begin to drift.
max_instrument_concentration = 0.20

# Minutes after the bell before a *new* position may be taken. Closes and
# resizes are never delayed -- being unable to leave is a worse failure than
# entering badly.
#
# Measured on Capital's own bars: the opening hour's median spread is 9.26bp
# against 7.14bp in the core session, 1.22x, and 28.89bp on INTC. Against an
# edge that breaks even near 6bp of friction, the auction gives away a fifth
# of the budget before the position has done anything.
#
# Asked of the market calendar -- "was this market also open thirty minutes
# ago" -- rather than computed from a session start, so daylight saving,
# holidays and per-instrument sessions are handled by the thing that already
# knows about them. The calendar covers the regular session only: it reports
# nothing open at 13:29 UTC and everything open at 13:31, so pre-market
# cannot answer the question early.
open_delay_minutes = 30

# The most positions that may be opened in a single pass.
#
# A book starting from flat otherwise opens everything at once. On
# 2026-08-28 a cold start would have taken thirteen positions in one pass,
# at the widest spreads of the day, on a seventeen-hour-old signal. It costs
# nothing when the book is warm, because a warm book rarely opens more than
# one or two at a time; it only binds on a restart.
#
# Highest conviction first, from the last look's re-evaluation rather than
# the stale signal -- if only three go through they should be the three the
# strategy believes in now.
max_opens_per_pass = 3            # 50% of the balance as margin, not 100%

# Notional per unit of signal size, as a multiple of equity. Raising this is
# gearing rather than edge -- efficiency peaks around 4 and degrades after.
exposure_per_unit_size = 4.0  # was 1.0; efficiency peaks here and degrades after

# Days either side of a reporting date to hold no position.
#
# One on risk grounds, not on measured return, and the distinction is the
# whole of the reasoning.
#
# The return evidence does not decide it. Swept on hourly bars over the eight
# traded names, a one-day window returned 102.4% against 98.4% with the rule
# off, on a shallower drawdown -- but the effect reverses between halves of
# the span. The first half prefers a blackout (156.7% against 130.7%), the
# second prefers none (59.8% against 70.8%), and by calendar year it helps
# in 2024 and hurts monotonically in 2025 and 2026. A value that wins overall
# by winning in one half is a bet on that half, so no figure here is a reason
# to switch it on.
#
# The risk evidence does decide it, and it is not a return measurement.
# Across 450 announcements the five sessions after a report carry 2.43x the
# instrument's usual movement (t=14.1, p=7e-38) with no directional edge
# whatever (p=0.42) -- and the reaction lands overnight, so it is a gap
# rather than something a stop can sit inside. On a book of eight names at
# 3.5x with a 20% concentration ceiling, one position can reach 0.7x equity,
# where a 15% adverse gap is a tenth of the account. That is undirected
# variance a trend system has no way to hold deliberately.
#
# One rather than two or three because it corresponds to a reason -- block
# the announcement itself -- rather than to an optimum. Two and three were
# both worse on every cut. It suppresses 3.2% of position-bars.
#
# The previous value of 0 was never a decision. The engine's blackout could
# not run at all: `_execution_config` read the earnings dates from the OS
# application-data directory instead of the lake, found none, and treated
# that as "nothing to black out". Whatever this said, the rule had never
# once bitten. The 0.5%-of-position-days figure the old comment reasoned
# from also predates a time stop of 0.29 days and a universe of eight.
earnings_blackout_days = 1

# Shrink a position when the instrument traded unusually heavily. Volume
# against the next day's range measured r=+0.177 at t=+39.03 on shares and
# +24.06 on indices, monotone across all ten deciles -- the quietest fifth of
# share sessions is followed by a 2.28% range and the heaviest by 3.41%.
#
# It shrinks and never grows, because it says nothing about direction: volume
# against the next return is r=-0.013, and a move up on heavy volume is
# followed by *worse* returns than the same move on light volume, so the
# intuition that conviction persists is backwards.
#
# The only risk signal here that works on indices, which file nothing with
# any regulator.
use_volume = true             # was false; same return, a tenth off the drawdown
volume_heavy_ratio = 1.5      # multiples of the 20-day median
volume_heavy_multiplier = 0.6

# Currency. With this off every rate resolves to 1.0 and a $150 share is
# marked at £150.
fx_enabled = true
account_currency = "GBP"
fx_conversion_fee_pct = 0.005

# Confidence a signal must reach to be offered as a trade. Note that the
# environment multiplier is folded into the confidence score and is 0.5 in
# high volatility, so any bar above 0.5 is unreachable on roughly one day in
# three. The dashboard says so when it happens rather than reporting silence.
# Folded into confidence, the environment multiplier caps the score at 0.5
# in high volatility, which makes a 0.60 bar a blackout on roughly one day
# in three rather than a filter. Off, the bar means what it says and the
# environment still scales the size.
environment_in_confidence = false
suggestion_confidence = 0.60

# Take no signal action on the first bar of a session.
#
# OFF, and it was briefly on. The case for it was that entries on the first
# bar of a session won 44.2% against 51.9% everywhere else (t=-2.26,
# p=0.025), and that the backtest returned 126.4% against 120.2%.
#
# Both numbers were computed while every dollar instrument was being marked
# at an exchange rate of 1.0 -- the conversion pairs were named in the rate
# map and absent from the lake, so a $150 share was marked at £150. Re-run
# with the rate attached, the trip-level finding falls to t=-1.63, p=0.104,
# and the rule costs 1.1pp of CAGR (138.7% against 139.8%).
#
# So it is off. The code stays, tested and documented, because the effect
# may be real and merely too small to see in two years of one regime -- but
# a rule shipped on evidence that turned out to be an artefact has no claim
# to stay on while it is re-earned.
#
# The defence against a stale decision at the open is now the last look in
# advisor/livecheck.py, which re-evaluates the signal against the live price
# before opening. That one survives the correction: t=+4.18, p=0.000038.
hold_across_session_open = false

# --------------------------------------------------------------------------- #
# The universe screen
# --------------------------------------------------------------------------- #
#
# The pool the screen ranks, and the sector map it caps concentration by.
#
# This is the screen's one remaining judgement call, and it is here so that
# it stays visible. Selecting mechanically from a hand-drawn list moves the
# bias rather than removing it; what it buys is that the selection *within*
# the pool is reproducible, and that the pool is one list somebody can argue
# with rather than nineteen decisions nobody wrote down.
#
# It lived in a scratch script until 2026-08-27, which meant every screen
# this project had run was reproducible only by whoever still had the file.
# That is the same defect the screen exists to fix, one level up.
#
# An instrument here is one the screen MAY RANK, not one it will hold. The
# traded universe is `market.tickers` and changing it stays a human act:
# `cfdinvest-universe screen` reports the difference and records it, and
# never edits this file.
#
# Known bias, stated rather than hidden: the pool is US large caps that are
# large *now*, so it is drawn with hindsight. Screening within it is
# reproducible; the pool itself is not a measurement.

[universe]
# Ninety-nine names, from 2026-08-29. Chosen by a rule rather than by
# hand: every US large cap Capital will deal, ranked by median daily
# turnover over the trailing year, top hundred, minus LIN which Capital
# quotes too thinly to measure (2,637 bars against a median of 9,052).
#
# The previous forty-nine were picked in 2026 knowing which had prospered,
# and that showed up everywhere -- concentrating into them amplified the
# hindsight rather than diluting it, and monthly reselection amplified it
# further, producing a backtest whose worst rolling year was +51%.
# Turnover is computable from data available at the time and knows nothing
# about outcomes.
#
# Two effects beyond honesty, both measured. The pool spans seven sectors
# where the old one was 22 of 49 technology, and the screen's own picks
# were entirely technology -- which matters because technology measured
# *worst* on direction predictability (0.496 against 0.528 for consumer).
# And it gives the short side something to work with: on the wider pool
# 41.8% of exposure is short against 16.4% on the eight-name book, because
# the old universe contained almost nothing that fell. Shorts earned
# 39,284 against longs' 49,213 over 3.65 years.
#
# It does not remove survivorship entirely -- these are large caps *today*,
# so companies that shrank out of the set are absent. That residue needs
# historical index membership, which is a paid data problem. It takes the
# bias from "we chose 49 knowing which won" to "we used a turnover rule",
# which is a different order of magnitude.
#
# Fixed size deliberately. Re-running the same turnover rule refreshes it;
# it does not grow.
candidates = [
    "NVDA", "TSLA", "MU", "AAPL", "MSFT", "AMD",
    "AMZN", "GOOGL", "META", "AVGO", "PLTR", "INTC",
    "ORCL", "NFLX", "LLY", "JPM", "UNH", "AMAT",
    "LRCX", "WMT", "CRM", "XOM", "COIN", "COST",
    "NOW", "CAT", "GS", "BAC", "JNJ", "CSCO",

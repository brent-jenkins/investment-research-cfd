# cfdinvest configuration
#
# Resolution order (later wins):
#   dataclass defaults  ->  this file  ->  environment (CFD_* / FRED_API_KEY)
#
# Point at a different file with $CFD_CONFIG_FILE.
# NEVER put the FRED API key here: it belongs in .env / the environment.

[paths]
# Root of the data lake. Relative paths resolve against the working directory;
# absolute paths (or $CFD_DATA_ROOT) are recommended for scheduled runs.
data_root = "data"

[market]
# The CFD universe: 43 instruments across indices, commodities, FX and
# single stocks. Every tradable entry corresponds to a Trading 212 CFD --
# cfdinvest/livehelper/t212_instruments.py names the match for each, and the
# signal layer holds anything unmatched flat.
#
# Two notes on how this list was chosen.
#
# These are the *indices and commodities themselves*, not ETFs that track
# them. SPY and Trading 212's US 500 both follow the S&P 500, but modelling
# an ETF and trading an index CFD are different things. ^GSPC is what the
# CFD is priced on.
#
# The single stocks were picked for liquidity, volatility and sector spread
# -- not for having gone up or down. A universe assembled from what already
# worked is fitted to the past, and every backtest over it flatters itself.
# The strategy trades both directions and the signal decides which; the job
# of this list is to offer instruments that *trend*, in enough different
# markets that they do not all turn at once.
# ONE TRADING SESSION, deliberately.
#
# Everything here trades 14:30-21:00 UTC. That is a constraint of the bar
# interval below, not a view about which markets are interesting.
#
# The analysis layer builds one matrix indexed by every timestamp across
# every instrument. On daily bars that is nearly dense -- one bar a day,
# roughly aligned. On hourly bars it is mostly holes, because FX trades
# around the clock, the Nikkei trades overnight and the FTSE closes before
# New York opens: each instrument is absent from about four rows in five.
# Rolling windows over a column that is 80% NaN return NaN, so conviction
# cannot be computed and every signal collapses to flat. Measured on the
# full forty-one at 1h: returns 19% populated, realised volatility 0.3%,
# and exactly zero active signals across 16,026 bars.
#
# Restricting to one session makes the panel dense again -- returns 100%,
# volatility 99.4% -- and the signals come back. Restoring FX, commodities
# and the European and Asian indices to intraday needs per-session panels
# in the preprocessing layer, which is real work and not yet done.
# Individual stocks only, and that is the objective rather than a leftover.
#
# Every source of non-price evidence this system has -- EDGAR filings,
# earnings dates, company news, sentiment -- exists for companies and cannot
# exist for an index. An index can only ever be traded on price, which is
# the one thing the trend engine already knows. Narrowing to stocks aligns
# the universe with the evidence available about it.
#
# The measurement agrees, and more strongly than expected. Over two years on
# hourly bars, at 2bp slippage:
#
#   universe               n    CAGR   max drawdown   Sharpe
#   shares + US indices   22   81.3%        -19.0%     1.97
#   shares only           19  126.7%        -19.6%     2.57
#   US indices only        3   -3.7%        -17.4%    -0.21
#
# The three indices lost money on their own and ranked 13th, 17th and 19th
# of twenty-two, contributing 7.6% of the gross while taking 14% of the
# universe. Under a gross exposure cap that is not neutral: capital in an
# index is capital not in a better position, which is why removing them
# raises the return rather than merely leaving it alone.
#
# Deliberately small. Twenty or thirty is the ceiling being considered, not
# a target -- a tight universe is what makes it possible to hold detailed
# data on each name, watch its filings and read its news, and a wider one
# would be monitored more thinly rather than more thoroughly.
#
# Eight names since 2026-08-28, down from nineteen. Sweeping the count with
# sector ignored gives a monotone curve on daily bars over the 49-name pool:
# 46.7% CAGR at six names, 40.3 at eight, 28.5 at ten, 25.1 at twelve, 21.2
# at sixteen, then flat near 10 from twenty out to thirty. Risk-adjusted it
# peaks at eight, 1.46 return-per-drawdown against 0.51 at thirty. Monotone
# is why this is believed: the same sweep pushed past its range is what
# exposed the sector cap and the 25% weight cap as wiggles.
#
# The gain is selection and not the pool. Against the same engine run over
# every eligible name with no screen at all -- both arms carrying the
# identical forty-nine names, so identical hindsight -- eight names is worth
# +1.06 return-per-drawdown. An excess measured against a yardstick that
# inherits the same bias cannot be that bias.
#
# The cost is concentration: drawdown deepens from -20.3% at thirty names to
# -27.7% at eight, and the engine's only backstop is the 20% per-instrument
# cap. Accepted deliberately rather than overlooked.
#
# Measured on daily bars, which is the related strategy and not the hourly
# one that deals. This is a forward test on a demo account, not a proof.
tickers = [
    "MU", "INTC", "AMD", "LRCX", "AMAT", "TSLA", "CAT", "BKNG",
    # Five technology at the sector cap, plus TSLA and BKNG (consumer) and
    # CAT (industrial). Uncapped the screen returned eight technology names
    # out of eight -- six of them semiconductors, three the same semicap
    # equipment trade -- from a pool where only a third are technology.
    # PLTR, NOW and KLAC are what the cap displaced.
    # The screen's top eight from the hundred-name pool, with no hand
    # exceptions. MU, INTC and PLTR were held out until 2026-08-29 and the
    # reasons no longer hold.
    #
    # MU and PLTR were held out for survivorship: the old forty-nine were
    # picked in 2026 knowing which had prospered, and the screen then ranked
    # liquidity at 0.50 weight, so price x volume rewarded whatever had risen
    # most. Both halves of that are gone -- the pool is a turnover rule now,
    # and liquidity is down to 0.20 against volatility's 0.70.
    #
    # And the survivorship signature is absent where it would show. A name in
    # the pool only because it rose earns going long in a rising market;
    # these earn in both directions and disproportionately short. Attributed
    # by the direction actually held, MU takes 23.3% of its P&L short and
    # PLTR 32.4%, against 18.3% for the whole book. PLTR alone is 14.1% of
    # all P&L and MU 9.0%.
    #
    # INTC came out on the owner's spread decision of 2026-08-28, and its
    # trailing spread is now 11.7bp -- 1.02x the universe median, exactly
    # ordinary. The 28.73bp that motivated it was a whole-history median
    # dominated by 2024-25.
    #
    # Measured, monthly reselection from the hundred over 3.65 years on
    # hourly bars with per-bar spreads: no overrides returns 77.4% at 2.26
    # return-per-drawdown against 71.2% and 1.75 with them. More importantly
    # it is far steadier across halves -- 78.3/76.6 against 91.1/53.6 -- so
    # the *override* arm is the period-dependent one.
    #
    # Concentration is the live risk and it is not a measurement error: five
    # of these eight are semiconductor names, and LRCX, AMAT and KLAC are the
    # same equipment trade three times. That is one bet wearing several
    # tickers, the per-instrument cap cannot see it, and the sector cap was
    # removed on evidence gathered before the pool was wide enough for this
    # to happen.
]
# Hourly, not daily.
#
# A CFD held for days pays financing that was 72% of every cost in the
# backtest, and a daily bar offers one decision per instrument per session
# -- the position is chosen once and then only watched. Measured over two
# years on the list above, against the same costs and the same engine:
#
#                  trips/yr   win%   %/trip   total%   hours held
#   daily               347   56.9    0.798    553.8        169.1
#   hourly, 7h stop   1,626   53.8    0.238    773.6         22.1
#
# Lower per trip, higher in total, and the mechanism is the holding period:
# 22 hours against 169 pays a fraction of the carry. At confidence >= 0.60
# the win rate goes from 61.8% to 75.3%.
#
# Finer intervals are available from the vendor but not usable: 15m and 5m
# carry only ~85 days of history, which is too little to validate against.
# Hourly is the shortest bar with two years behind it.
#
# One source of truth for intraday, and it is the venue that fills the
# orders. Until 2026-08-30 this read "1h" -- yfinance bars -- while every
# order was placed at Capital's prices, so the book decided on one feed and
# dealt on another. That is two sources of truth for the same question, and
# the one that matters is whichever the fill happens against.
#
# What changes with it:
#
#   * the bars carry a bid, an ask and a spread, so cost can be charged as
#     quoted rather than assumed -- see use_measured_spreads, which is only
#     meaningful on this feed since yfinance serves no spread at all;
#   * history reaches back to 2023-01-03 rather than yfinance's rolling
#     730-day window, which is what let a headline CAGR be quoted over a
#     span that excluded the worst year;
#   * `close` is the bid/ask midpoint rather than a last trade, and
#     `volume` is a tick count roughly 414x smaller than shares -- so no
#     order-flow reading of this feed means what it appears to.
#
# yfinance is unchanged as the source for daily bars, real share volume and
# the screening series (_SCREENING_INTERVAL = "1d"). It is a good picture of
# the universe; it is simply not what we deal against.
interval = "capital_1h"  # "capital_1h", "1d", "1h" or "1wk"
start = "2005-01-01"
# end = "2025-01-01"     # omit for "up to now"
auto_adjust = true       # split/dividend-adjusted OHLC
include_actions = true   # also store dividends and splits
batch_size = 25          # tickers per yfinance request
threads = 8
refetch_overlap_days = 5 # re-read recent bars to pick up vendor revisions

[macro]
# FRED series driving the macro-regime classifier.
series_ids = [
    "DGS10",      # 10Y Treasury constant maturity
    "DGS2",       # 2Y Treasury
    "T10Y2Y",     # 10Y-2Y term spread (recession signal)
    "T10Y3M",     # 10Y-3M term spread
    "DFF",        # Effective fed funds rate
    "VIXCLS",     # CBOE volatility index
    "BAMLH0A0HYM2",  # ICE BofA US high-yield OAS (credit stress)
    "CPIAUCSL",   # CPI, all urban consumers
    "UNRATE",     # Unemployment rate
    "INDPRO",     # Industrial production
    "USREC",      # NBER recession indicator
    "DTWEXBGS",   # Trade-weighted USD index
]
observation_start = "1990-01-01"

# How the series are sourced with respect to revisions. One of:
#
#   "publication_lag"  DEFAULT. Every observation carries a real publication
#                      date, obtained the best way available for that series:
#                      FRED's first prints where it serves them, otherwise the
#                      latest values stamped observation_date + release lag.
#                      Safe as a global default because only high-vintage
#                      DAILY series ever take the fallback, and those are not
#                      revised.
#
#   "initial_release"  strictly first prints. Falls back to publication_lag
#                      when FRED refuses the vintage span, and warns loudly.
#
#   "latest"           newest revision of every observation. Look-ahead
#                      biased: 2008 GDP as restated today is not what a trader
#                      saw in 2008. Opt in deliberately.
#
#   "vintage"          ALFRED snapshot as of a fixed date. Requires
#                      realtime_start / realtime_end below, which are sent to
#                      FRED exactly as written here.
#
# Leave unset to derive: "vintage" if realtime bounds are set, else
# "publication_lag". The mode ACTUALLY used (after any fallback) is recorded
# per series in data/metadata/macro_manifest.json and readable via
# DataRepository.macro_vintage_mode(). Modes are never mixed inside one file
# -- changing one requires ingest(allow_mode_change=True), which replaces it.
# vintage_mode = "publication_lag"

# Publication lag applied when first prints are unavailable and a synthetic
# publication date must be derived. 1 day suits daily rate series, which are
# the only ones that ever fall back.
fallback_release_lag_days = 1

# realtime_start = "2020-04-01"
# realtime_end   = "2020-04-01"
refetch_overlap_days = 45   # macro prints are revised for months
max_workers = 6
min_request_interval = 0.55 # FRED allows 120 requests/minute
fetch_metadata = true

# --- Per-series overrides -------------------------------------------------
# Any macro setting can be pinned for a single series. Sub-tables must come
# after every plain key in [macro] above.
#
# Daily rate series are never revised, so latest costs nothing and skips the
# fallback round-trip entirely:
#
# [macro.series_overrides.DGS10]
# vintage_mode = "latest"
# release_lag_days = 1
#
# [macro.series_overrides.T10Y2Y]
# vintage_mode = "latest"

[network]
timeout = 30.0
max_retries = 4
backoff_base = 1.5
backoff_cap = 30.0

[storage]
compression = "zstd"        # "zstd", "snappy", "gzip" or "none"
row_group_size = 100000

[logging]
level = "INFO"
# log_file = "logs/cfdinvest.log"

# --------------------------------------------------------------------------- #
# What the system does
#
# Everything above this line is plumbing: where the lake lives, how to talk to
# the vendors, how to store what comes back. None of it changes a trading
# decision. Everything below does.
#
# These lived as dataclass defaults across three modules until 2026-08-26. The
# problem with that is not untidiness: changing one means editing Python and
# restarting a service, and a long-running daemon goes on executing the modules
# it imported at start-up. FX conversion was switched on in the code and stayed
# off in production for eleven hours because of exactly that. A value read from
# this file on each run cannot fail that way, and the run records what it used.
#
# The values here reproduce the behaviour recorded before the section existed.
# The commented figures are what testing preferred; they are not enabled,
# because a strategy change should be a decision rather than a default.
# --------------------------------------------------------------------------- #
[strategy]

# "gate" permits or forbids a direction; "tilt" scales size by how favourable
# the regime is. Tilting returned -40.9% against the gate's -54.7% over the
# full history, and the ordering carries real information -- flattening the
# tilts entirely gave -82.5%.
regime_mode = "tilt"          # was "gate"; tilting returned -40.9% against -54.7%

# Whether a flat signal closes an open position. Reading flat as "no view"
# rather than "get out" quadrupled gross P&L.
exit_on_flat = false          # was true; reading flat as "no view" quadrupled gross P&L
exit_on_opposing_signal = false

# Close a position that is still behind after this long, financing deducted.
# In days, so a fraction is a part-session: 0.29 is seven hours, which on
# hourly bars is one US cash session.
#
# It was 1 day, chosen on daily bars where 73% of eventual losers were
# already behind on day one against 29% of eventual winners. The same idea
# at the new bar size, re-measured over two years on this universe:
#
#   stop      trips/yr   win%   total%   hours held
#   1 day          484   48.3    247.3         50.1
#   7 hours      1,626   53.8    773.6         22.1
#
# Carrying a daily stop onto hourly bars is the worst of both -- it keeps
# the carry and gives up the extra decisions. Left at one session because
# shorter stops measured no better and appear to clamp: 3-hour and 1-hour
# stops returned byte-identical results, which is a floor in the engine
# rather than a finding, and not something to tune against until it is
# understood.
#
# RE-MEASURED under the corrected cost model (2026-08-31, screen-gated at
# target 10 on Capital bars with measured spreads, baseline
# 254.9%/-41.4%).
# The 773.6% figure above came from yfinance bars at a flat 5bp and is
# superseded as a number, but its conclusion holds and hardens:
#
#   time stop     CAGR     maxDD   cost/gross
#   none         -58.6%    97.5%     1163.1%
#   0.29          254.9%   41.4%       34.9%
#   0.5           254.9%   41.4%       34.9%
#   1.0            96.1%   46.5%       49.0%
#   2.0            17.6%   61.0%       82.4%
#
# Removing it does not merely cost return, it destroys the account: cost
# runs to eleven times gross profit because positions stop being closed by
# anything. This is the single most load-bearing parameter measured.
#
# 0.29 and 0.5 are byte-identical, which is the same engine clamp the
# comment above describes -- anything under one session rounds to one
# session. The arm asserted its value reached the config, so this is a
# clamp rather than an inert test.
time_stop_days = 0.29         # one US session; removing it returns -58.6%

# Days an instrument is left alone after a position in it closes.
#
# Two hours, and it is close to a formality. The fourteen-day figure came
# from daily bars and seven-day holds, and until now it was never tested
# against anything: the engine stamped the close *before* the time stop ran,
# so a time-stop exit recorded no close at all and the cooldown never
# applied to it -- which, in a configuration where the time stop is the
# usual exit, meant no cooldown at all whatever the file said.
#
# Measured properly for the first time, holding the stop at 0.29d:
#
#   cooldown    0h     2h     6h     1d     2d     7d
#   CAGR     154.9  155.6  116.3   86.5  160.8  100.9
#
# That is not a relationship. It rises, falls, collapses and recovers with
# no coherent shape, and the two-day peak has an eighty-seven per cent
# trough immediately beside it -- choosing it would be fitting the wiggle.
# The honest reading is that on this bar size the cooldown earns nothing.
#
# Two hours rather than zero only to stop an instrument being re-entered on
# the bar after it was stopped out, which is churn rather than a decision.
# Between zero and two hours the measurement cannot tell the difference, and
# this comment should not pretend otherwise.
reentry_cooldown_days = 0.083 # two hours; the multi-day version measured as noise

# Relative drift before an open position is resized. At 3.0 and above, drift
# rebalancing is off entirely and only opens and closes remain.
#
# RE-MEASURED (2026-08-31, screen-gated at target 10 on Capital bars
# with measured spreads, baseline 254.9%/-41.4%):
#
#   threshold    CAGR     maxDD     H1       H2
#   3.0 (off)   254.9%    41.4%   228.3%   284.1%
#   1.0         276.8%    45.5%   252.5%   303.0%
#   0.5         178.9%    49.3%
#   0.25        152.3%    43.4%
#
# The Calmar column that used to sit here (6.17 against 6.08) is gone. It
# was the stated reason for refusing 1.0 and it was computed from two single
# realisations of a drawdown whose modelled spread is far wider than the
# difference between them -- so it was arithmetic on noise, and leaving it
# in the table would invite the same conclusion being drawn again.
#
# MEASURED AND NOT ADOPTED -- and the FIRST reasons given for refusing it
# were both wrong, which is recorded because a right answer reached the
# wrong way is one that reverses the next time somebody re-derives it.
#
# Retracted: "the whole gain is returned in drawdown, 41.4% to 45.5%". That
# compared two single realisations. Block-bootstrapping both arms (4,000
# paths, block 20) puts their drawdown distributions on top of each other --
# p50 45.4% against 45.0%, and 1.0's paths land beyond the configured arm's
# median 48.5% of the time, which is a coin flip. The 4.1pp was sequencing
# noise inside a distribution far wider than it, and refusing a change on it
# was not a decision.
#
# Retracted: "review_drawdown_fraction is 0.45, so 45.5% sits above it".
# That threshold was itself set from a single path and is now 0.50.
#
# The real reason is the leverage control, which should have been run first.
# The two arms differ by ELEVEN round trips out of 4,179 -- a large effect
# from a tiny cause, which is this project's definition of something to
# investigate rather than believe. What actually changes is exposure: mean
# leverage 1.65 to 1.69, held names and flat bars identical. Raising
# exposure by that same 1.023x with rebalancing OFF returns 265.2%, so:
#
#   3.0 (off, configured)   254.9%   H1 228.3%   H2 284.1%   maxDD 41.4%
#   exposure 1.023x, off    265.2%   H1 233.3%   H2 300.4%   maxDD 40.8%
#   1.0 (rebalancing on)    276.7%   H1 252.5%   H2 303.0%   maxDD 45.5%
#
#   differential            H1 +19.1pp   H2 +2.6pp   whole +11.5pp
#
# Half the headline gain is exposure, and the half belonging to the RULE
# does not survive the split: +19.1pp in the first half and +2.6pp in the
# second, which is inside the 8pp floor and indistinguishable from nothing.
# A first-half-only effect is a period, not a parameter.
#
# The exposure arm is also NOT adopted, deliberately. It is positive in both
# halves and draws down slightly less, but +10.3pp barely clears the floor,
# its own halves are +5.0pp and +16.3pp, and raising leverage on a funded
# account because one backtest liked it by ten points is the overfitting
# this file exists to prevent. exposure_per_unit_size stays where it is.
#
# The old 0.25 is now firmly refuted rather than merely superseded. The note
# that "0.5 beat it in 9 of 10 out-of-sample windows" was measured at a flat
# 5bp; at measured spreads 0.5 returns 178.9% against 254.9%, because drift
# rebalancing buys precision with turnover and turnover is what got dearer.
rebalance_threshold = 3.0     # off; 1.0's gain is exposure plus a first-half effect

# Confidence a signal needs to open a position, and the level below which an
# open one is closed. The gap between them is hysteresis: it stops a position
# being churned by a confidence reading wobbling across a single line.
#
# This is the strategy's real entry bar, and until now it lived only as a
# dataclass default -- no configuration file named the number the engine
# traded on. The paper book's arms were then chosen as round numbers
# (0.50/0.60/0.70) without anyone checking against it, so the forward record
# was validating a configuration measurably worse than the one being
# backtested.
#
# SUPERSEDED, struck rather than deleted: 0.00/0.35/0.40/0.50/0.60/0.70/0.80
# returning 103.6/126.7/121.4/85.6/71.6/67.7/52.3%, measured over two years
# on yfinance bars at a flat 5bp. Both the feed and the cost model have since
# changed, and each changes every number.
#
# Re-measured 2026-08-30 through the engine on Capital bars with measured
# spreads, screen-gated at target 10, entry_size at the signal floor -- which
# matters, because with that floor removed this is the ONLY filter left
# between a signal and a position. Entry and exit move as a pair at the
# existing ratio; the engine refuses exit above entry.
#
#   entry/exit    CAGR    maxDD   Calmar   trades
#   0.00/0.00   141.4%   -44.7%     3.16    4,495
#   0.15/0.09   141.4%   -44.7%     3.16    4,495   (inert: see below)
#   0.25/0.14   134.5%   -42.0%     3.20    4,131
#   0.30/0.17   129.8%   -44.3%     2.93    4,265
#   0.35/0.20   130.5%   -40.3%     3.24    3,968   <- kept
#   0.45/0.26    82.8%   -38.3%     2.16    2,835
#   0.55/0.31    36.1%   -32.5%     1.11    2,199
#
# Confidence has a hard floor at exactly 0.1500 by construction, so 100% of
# non-zero readings clear a 0.15 gate and that arm cannot bite. The two
# identical rows are the sweep saying so, not a bug -- checked, because
# identical arms are how this project has previously reported a baseline
# twice under different labels.
#
# 0.35 is KEPT, and deliberately not moved to the peak. Removing the gate
# buys +11.0pp of return for +4.4pp of drawdown, and Calmar is flat across
# 0.00 to 0.35 (3.16 / 3.20 / 3.24, indistinguishable) -- so the extra
# return is bought with proportional risk rather than earned. At 1.4x the
# 8.0pp noise floor that is not enough to move a live parameter when the
# risk-adjusted measure calls the arms equivalent and 0.35 carries the
# lowest drawdown of the high-return group.
#
# ALL OF THE ABOVE IS RETRACTED, 2026-09-04. Every figure in it was measured
# on an engine whose time stop decided using a bar's close and filled at that
# bar's open -- look-ahead, on 88% of all exits, worth about 1.02% per exit
# across 2,278 exits. Corrected, the strategy returns -47.5% at this gate
# rather than +467.7%, and "raising the gate is destructive" inverts:
#
#     gate    cost/gross    CAGR      H1      H2   2023  2024  2025  2026
#     0.35        192.2%   -47.5%  -39.0%  -54.8%   +35   -77   -35   -66
#     0.55         98.5%    +0.7%
#     0.65         63.4%   +21.0%
#     0.75         37.2%   +48.4%  +51.9%  +45.0%   +87   +16   +83   +23
#     0.85                 +33.9%
#
# Monotone to a peak at 0.75 and turning over after it, so an interior
# optimum rather than the edge of a sweep. Positive in both halves and in
# four years of four, against a 9.3pp noise floor re-derived for this book by
# varying the screen's selection lag alone. The old 8pp floor belonged to a
# book six times larger and does not apply.
#
# Why the sign flipped: with an exit that could see the bar coming, marginal
# trades were nearly free to take and the gate had little to do. Without it,
# which trades are taken is the whole game -- gross P&L RISES from +98k to
# +512k as the gate goes up, so selectivity is not merely saving spread, it
# is removing trades that lost money gross.
entry_confidence = 0.75
exit_confidence = 0.20

# How large a signal must be before the book acts on it, and the level an
# open position is closed below.
#
# The fourth limit found living only in a dataclass default, after
# max_leverage, slippage_bps and entry_confidence: _execution_config built
# HysteresisThresholds passing only the confidence pair, so no configuration
# file named these and no sweep could reach them.
#
# It exists to stop a position being opened for a rounding error and closed
# again next bar. It had become the binding SELECTION rule instead: of
# 51,232 bar x ticker cells, 29,079 carried a view, 23,841 cleared the
# confidence gate, and only 8,269 cleared this -- 65% of what confidence had
# already approved, discarded. The book sat flat on 50.6% of bars holding
# 1.45 names while the screen was offering ten.
#
# Measured through the engine on Capital bars with measured spreads,
# screen-gated at target 10. Entry and exit move together because the engine
# refuses an inverted band:
#
#     entry/exit    CAGR    maxDD   Calmar   trades   flat bars
#     0.02/0.01   130.5%   -40.3%     3.24    3,968        6.5%   <- set
#     0.04/0.02   126.2%   -40.8%     3.09    2,770       12.1%
#     0.06/0.03    89.5%   -50.7%     1.77    2,063       28.3%
#     0.08/0.04    89.3%   -47.3%     1.89    1,639       42.5%
#     0.10/0.05    82.3%   -41.3%     1.99    1,283       52.5%   <- was
#     0.15/0.075   36.6%   -45.1%     0.81      727       71.5%
#     0.20/0.10    24.4%   -37.7%     0.65      442       81.3%
#
# Not leverage in disguise. Removing the floor lifts mean gross leverage
# from 0.695 to 1.123, but levering the old book by that same 1.62x returns
# 101.8% at -43.4% -- under half the gain, and worse drawdown. The balance
# comes from holding 4.12 names rather than 1.45. Drawdown is flat at -40.3%
# against -41.3% and Calmar rises 1.99 to 3.24.
#
# 0.02 is signal.min_size, so this removes the floor rather than lowering
# it: every non-zero signal clears it. Because exit must not exceed entry,
# that also retires the size-based exit -- positions leave on a direction
# flip or the time stop. Loosening the exit alone is worth +11.5pp of the
# +48.2pp, so the entry side carries the majority, but they are not
# separable here and the figure is the pair's.
entry_size = 0.02
exit_size = 0.01

# How strongly position size follows conviction above the entry bar.
#
# Until 2026-08-30 confidence was used only as a gate. Everything clearing
# 0.35 was sized identically, whether it scored 0.36 or 0.95, so the ordering
# the score carries was thrown away at the moment of acting on it.
#
# RETRACTED 2026-09-03: "confidence is the best predictor of outcome this book
# has -- +0.248 rank correlation against realised trip P&L, where a
# purpose-built sixteen-feature model managed +0.129." Both were read on the
# fill bar, not the decision bar the engine gates on. Corrected: confidence
# +0.023, and a walk-forward sixteen-feature model +0.0777 -- the model is
# about four times better, not half as good. The value below is unaffected;
# it was set from engine arms with a leverage-matched control, not from that
# correlation. No band of the model loses money, so it cannot filter, and its
# skill is at win rate, which runs against mean P&L in this book. See
# execution/engine.py: _size_by_confidence.
#
# Measured through the engine, screen-gated at target 10, Capital bars,
# measured spreads:
#
#   strength    CAGR    maxDD   Calmar   mean lev
#   0 (off)   130.5%   -40.3%     3.24      1.123
#   0.5       254.9%   -41.4%     6.17      1.655   <- set
#   1.0       319.8%   -47.2%     6.77      1.824
#   2.0       357.9%   -50.7%     7.06      1.977
#   4.0       371.3%   -53.6%     6.93      2.109
#
# RAISED FROM 0.5 TO 0.75 on 2026-09-01, and the reason 0.5 was chosen is
# **refuted rather than superseded**. That reason was "the stronger settings
# buy return with risk rather than earning it", and it was never tested: no
# leverage control was run above 0.5. Run now, 0.75 EARNS it.
#
#   arm                                CAGR       H1       H2   maxDD    lev
#   strength 0.5                     257.7%   235.0%   282.3%   41.9%   1.66
#   exposure 1.058x, strength 0.5    272.0%   243.3%   303.3%   41.3%   1.69
#   strength 0.75                    307.7%   301.2%   314.5%   44.1%   1.75
#
#   differential   whole +35.8pp   H1 +57.9pp   H2 +11.3pp
#
# Matching the exposure without the conviction buys only 14.3pp of the 50pp,
# so about 36pp belongs to the rule. Positive in both halves, both clear of
# the 8pp floor.
#
# Validated three further ways, each able to kill it. Ahead in 3 of 3 full
# years (+34.5, +32.9, +15.9pp) and 10 of 14 quarters. Block-bootstrapped,
# 0.75 beats 0.5's median return on 63.5% of paths against a 50% coin flip,
# and its TENTH percentile improves from 1870% to 2887% -- the bad paths get
# better too. And it is not fitted to the universe size: +47.4, +50.0, +32.9
# and +42.7pp at targets 8, 10, 12 and 16.
#
# Drawdown is genuinely a little worse and that is the price: 41.9% to 44.1%
# realised, and p50 45.0% to 46.4% resampled with 56.3% of paths beyond 0.5's
# median. Calmar still improves, 6.15 to 6.98.
#
# NOT taken past 0.75 although the sweep keeps rising -- 325.2% at 1.0 and
# 346.5% at 1.5. Only 0.75 has been through the controls, and drawdown
# reaches 49.2% by 1.5. Following a monotone curve past the last tested point
# is the overfitting the noise floor exists to prevent.
#
# The original reasoning below still stands and is why any of this is adopted:
#
# NOT LEVERAGE, and that distinction is why this is adopted at all. Sizing by
# conviction lifts mean gross leverage from 1.123 to 1.655. This project once
# credited exactly such a gain to selection when the mechanism was a mixture
# nobody had separated -- and then retracted it before the control had run. So
# the control ran first here, matched on REALISED leverage rather than nominal
# because the caps bind differently: uniform exposure at leverage 1.659
# returns 198.9% at -46.7%, against conviction's 254.9% at -41.4%. Allocating
# the same exposure by conviction is worth +56pp and 5.3pp less drawdown.
#
# And it holds in both halves independently -- +106.6pp in the first, +151.9pp
# in the second -- with Calmar improving in each. Not one episode, and not
# risk-bought return.
#
# The absolute figures are not a forecast. They sit on top of the screen's own
# +150pp ranking edge over a 3.65-year window, and the demo account is the
# only thing that can say whether any of it transfers.
confidence_sizing_strength = 0.75

# The smallest multiplier conviction sizing may produce. The gate has already
# decided a signal is worth taking; this trims it rather than erasing it,
# which would be a second unmeasured gate wearing a multiplier.
# INERT, measured 2026-09-01: 0.0, 0.10, 0.25 and 0.50 return identical
# results to the decimal. With a non-negative strength and confidence at or
# above the entry bar the multiplier is never below 1.0, so this floor cannot
# bind. Left in place because it would bind if strength were ever negative or
# the gate lowered below the confidence used, but it decides nothing today
# and should not be reasoned about as if it did.
confidence_sizing_floor = 0.25

# Execution friction beyond the spread, in basis points of price. The spread
# is charged separately; this is what the quote moves between deciding and
# filling.
#
# It was zero, which on a book turning over ~15,000 times in two years is
# the most flattering assumption in the whole backtest -- and the live
# daemon acts up to fifteen minutes after an hourly bar closes, which the
# backtest does not model at all.
#
#   slippage    0bp    0.5bp   1bp     2bp     5bp     10bp
#   CAGR      155.6%  135.1%  113.8%   81.3%    9.4%  -52.4%
#
# Break-even against buy-and-hold (22.4% a year) is near 4bp. 2.0 is the
# cautious end of what a £1,000 retail order should suffer at a broker's own
# quote, and the point of setting it is to stop the backtest flattering
# itself rather than to model any measured figure -- nobody has measured
# this, because no order has ever been placed.
slippage_bps = 2.0

# Gross notional the book may carry, as a multiple of equity -- the margin
# dial. Trading 212 gives 5x on shares, so gross exposure of G times equity
# commits about G/5 of the account as margin.
#
# This was never passed through from the configuration at all: the execution
# default of 5.0 applied, which is 100% of the balance committed as margin,
# by omission rather than by choice. Measured over two years on hourly bars:
#
#   max_leverage   margin   CAGR    max drawdown   Sharpe
#          5.0      100%   374.4%        -21.5%     3.37
#          2.5       50%   121.4%        -18.4%     2.60
#          1.5       30%    87.6%        -11.1%     3.06
#          1.0       20%    53.9%         -8.6%     2.91
#
# 2.5 because a book at full margin has no room for an adverse move before
# the broker closes it, and because the return that comes with it is gearing
# rather than edge -- the strategy beats buy-and-hold of the same universe
# (22.4% a year, -23.9% drawdown) at every setting on this table.
max_leverage = 3.5
#
# Raised from 2.5 on 2026-08-28. The table above was measured on the two-year
# yfinance window, the one that excludes 2023 -- the same artefact as the
# 139.8% headline -- so it was not evidence for anything. Re-measured on
# Capital's 3.65 years with drift rebalancing on and the concentration cap
# applied:
#
#   max_leverage   margin   CAGR    max drawdown   CAGR/DD
#          2.5       50%    49.1%        -32.6%      1.51
#          3.0       60%    56.8%        -38.8%      1.46
#          3.5       70%    69.6%        -34.6%      2.01
#          4.0       80%    64.7%        -45.2%      1.43
#          5.0      100%    66.6%        -53.4%      1.25
#
# 3.5 is the peak on both return and risk-adjusted return. Above it the
# return flattens while the drawdown deteriorates sharply, which is gearing
# rather than edge.
#
# Capital's margin factor is fixed at 20%, so this commits 70% of the account
# and a call arrives once equity has fallen 30%. That is only survivable
# because of the cap below: at 3.5x with no concentration limit, one name
# gapping 8.6% is a margin call.

# The largest share of the gross ceiling any one instrument may take.
#
# The bridge has enforced this since it was written; the engine never did,
# so every backtest figure before 2026-08-28 was measured on a book that
# could put everything into one name. It matters because the book is thin
# far more often than it looks: over 3.65 years it holds a single name on
# 17.3% of bars and two or fewer on 30.3%.
#
# Capping it improves the return as well as the drawdown, which is not what
# a diversification constraint usually does -- this strategy's concentrated
# positions are its worse bets:
#
#   concentration   CAGR    max drawdown   CAGR/DD   calls on a gap of
#          none     63.5%       -37.9%       1.68           8.6%
#          0.40     62.6%       -41.0%       1.52          21.4%
#          0.25     66.6%       -38.5%       1.73          34.3%
#          0.20     69.6%       -34.6%       2.01          42.9%
#          0.15     67.6%       -35.9%       1.88          57.1%
#
# 0.20 rather than 0.15 because the improvement has flattened by then and
# the tighter cap starts leaving the account under-invested when few names
# qualify. Read by the engine and by `RiskLimits.for_balance`, from here
# and nowhere else -- it was a default argument in two places, which is how
# two copies of a limit begin to drift.
max_instrument_concentration = 0.20

# **SET TO 0 on 2026-09-09.** The delay costs about 58 percentage points a
# year and the reason it was set is a cost argument the cost model already
# charges.
#
# Measured through the engine on cap 8 / target 50 -- the only universe this
# project has ever measured correctly -- with per-bar spreads applied, so the
# opening auction's premium is PAID in every figure below:
#
#     open  close     CAGR   maxDD  Calmar  trades   lev    cost
#        0      0   262.7%   13.5%   19.52   2,645  0.90   37.3%
#        0     60   250.3%   11.9%   21.01   2,506  0.90   34.8%   <- shipped
#        0    120   230.7%   11.8%   19.52   2,284  0.88   34.3%
#       30      0   204.0%    9.4%   21.62   2,340  0.88   38.7%
#       30     60   191.0%    6.6%   28.87   2,119  0.89   34.9%   <- was
#       30    120   174.4%    7.1%   24.67   1,890  0.86   33.9%
#
# +59.2pp at close 60, +58.7pp at close 0, +56.3pp at close 120 -- consistent
# whatever the other end does, and six times the 9.3pp floor. Positive in
# both halves and in 4 of 4 years.
#
# **It is not bought with exposure.** Mean leverage is 0.90 against 0.89, so
# the leverage-matched control that retired `rebalance_threshold` has nothing
# to bite on. And the cost share is 34.8% against 34.9%: the opening hour IS
# dearer to trade, and the trades it yields carry that cost without moving
# the ratio.
#
# RETRACTED, the old justification: "the opening hour's median spread is
# 9.26bp against 7.14bp in the core session, 1.22x, and 28.89bp on INTC.
# Against an edge that breaks even near 6bp of friction, the auction gives
# away a fifth of the budget before the position has done anything." Every
# word of that spread measurement still stands. What does not follow is the
# conclusion: the engine charges those spreads and taking the bar still wins.
# A cost being real is not the same as it being decisive.
#
# ALSO RETRACTED: the +19.5pp recorded on 2026-09-01 for modelling this
# delay. It was measured on the flawed engine AND on the raw-ranking
# universe, so it is doubly superseded, and there is now no surviving
# evidence in favour of a delay at all.
#
# WHAT IT COSTS: drawdown 6.6% to 11.9% and Calmar 28.87 to 21.01. The old
# setting had the best risk-adjusted return of the six arms. This is a
# risk-appetite decision the owner took on 2026-09-09, not a measurement
# saying one is right -- and it was prompted by the live case that morning,
# where BKNG fell 3.0% in the opening hour at confidence 1.000 and the delay
# refused it. What is NOT yet done is the block bootstrap.
#
# Closes and resizes were never delayed and still are not -- being unable to
# leave is a worse failure than entering badly.
open_delay_minutes = 0

# The most positions that may be opened in a single pass.
#
# A book starting from flat otherwise opens everything at once. On
# 2026-08-28 a cold start would have taken thirteen positions in one pass,
# at the widest spreads of the day, on a seventeen-hour-old signal. It costs
# nothing when the book is warm, because a warm book rarely opens more than
# one or two at a time; it only binds on a restart.
#
# Highest conviction first, from the last look's re-evaluation rather than
# the stale signal -- if only three go through they should be the three the
# strategy believes in now.
# Day trading: flatten before the bell, and stop opening into it.
#
# These two move TOGETHER and neither ships alone. Refusing late entries
# without flattening returns 95.4% against a 103.8% baseline -- the losing
# half of a winning pair -- so a default that enabled one would be worse than
# nothing.
#
# Measured on the corrected engine at gate 0.75 over 25 names, against a
# 9.3pp floor:
#
#   arm                          CAGR    maxDD   cost   Calmar
#   carry overnight (was)      103.8%    14.8%  38.4%     7.04
#   flatten                    166.8%    10.5%  25.8%    15.94
#   flatten + no opens 1h      159.2%     7.3%  24.2%    21.82
#   no opens 1h, still carry    95.4%    10.5%  34.1%     9.05
#
# The last row is the control and it is what identifies the mechanism: the
# gain is not carrying overnight, not entry timing. Full battery: both halves
# (+141/+179), four years of four, 99.7% of bootstrap paths ahead with 0.1%
# drawing down worse, positive at 10, 16 and 25 names, and it earns more on
# LESS leverage -- 0.27x against 0.40x -- so exposure cannot explain it.
#
# Why this was invisible until 2026-09-04: every earlier test of flattening
# competed against a time stop that could see the fill bar. An exit that
# cheats beats an honest one. The strategy also carried 94% of entries
# overnight structurally rather than by choice -- time_stop_days of 0.29 is
# 6.96 hours against a six-hour session, so nothing could reach its stop
# before the close. Nobody chose that.
flatten_before_close = true
close_delay_minutes = 60

max_opens_per_pass = 3            # 50% of the balance as margin, not 100%

# The most of the balance that committed margin may consume, or unset to not
# check it. OFF, and turning it on changes what the account does.
#
# Capital publishes a marginFactor per instrument and varies it: tiered by
# position size, raised in volatile conditions and around events. A factor
# rising under an open position increases required margin without the book
# changing at all, and nothing here read that figure until 2026-09-03 -- it
# was fetched from the day the account opened and discarded.
#
# Measured on the demo account: 44.2% utilisation on 2026-09-03 and 66.6% on
# 2026-09-01, so 0.50 would have refused opens on the second of those. Pick
# the number deliberately: this is the only thing standing between a raised
# margin factor and a forced close-out, and the engine cannot price the risk
# -- it has no close-out model, so every drawdown figure in CLAUDE.md is an
# upper bound on what a funded account would survive.
#
# Deliberately not inherited from RiskLimits.max_margin_usage_pct (0.50),
# which belongs to the manual helper: one number answering two questions is
# how this project has been caught before.
#
# The gate fails CLOSED. An unreadable headroom or an instrument with no
# quoted factor refuses the open rather than proceeding, because a margin
# guard that disables itself reads as protection while providing none.
# max_margin_usage = 0.80

# Notional per unit of signal size, as a multiple of equity. Raising this is
# gearing rather than edge -- efficiency peaks around 4 and degrades after.
exposure_per_unit_size = 4.0  # was 1.0; efficiency peaks here and degrades after

# Days either side of a reporting date to hold no position.
#
# One on risk grounds, not on measured return, and the distinction is the
# whole of the reasoning.
#
# The return evidence does not decide it. Swept on hourly bars over the eight
# traded names, a one-day window returned 102.4% against 98.4% with the rule
# off, on a shallower drawdown -- but the effect reverses between halves of
# the span. The first half prefers a blackout (156.7% against 130.7%), the
# second prefers none (59.8% against 70.8%), and by calendar year it helps
# in 2024 and hurts monotonically in 2025 and 2026. A value that wins overall
# by winning in one half is a bet on that half, so no figure here is a reason
# to switch it on.
#
# The risk evidence does decide it, and it is not a return measurement.
# Across 450 announcements the five sessions after a report carry 2.43x the
# instrument's usual movement (t=14.1, p=7e-38) with no directional edge
# whatever (p=0.42) -- and the reaction lands overnight, so it is a gap
# rather than something a stop can sit inside. On a book of eight names at
# 3.5x with a 20% concentration ceiling, one position can reach 0.7x equity,
# where a 15% adverse gap is a tenth of the account. That is undirected
# variance a trend system has no way to hold deliberately.
#
# One rather than two or three because it corresponds to a reason -- block
# the announcement itself -- rather than to an optimum. Two and three were
# both worse on every cut. It suppresses 3.2% of position-bars.
#
# The previous value of 0 was never a decision. The engine's blackout could
# not run at all: `_execution_config` read the earnings dates from the OS
# application-data directory instead of the lake, found none, and treated
# that as "nothing to black out". Whatever this said, the rule had never
# once bitten. The 0.5%-of-position-days figure the old comment reasoned
# from also predates a time stop of 0.29 days and a universe of eight.
#
# RE-MEASURED (2026-08-31, screen-gated at target 10 on Capital bars
# with measured spreads, baseline 254.9%/-41.4%):
#
#   blackout    CAGR     maxDD
#   0 days     215.9%    52.5%
#   1 day      254.9%    41.4%
#   2 days     250.8%    40.8%
#   3 days     252.8%    41.3%
#
# Confirmed, and on the grounds it was chosen for. Switching it off costs
# 39pp of return AND 11.1pp of drawdown, so it is load-bearing on both
# counts now that it actually runs. One, two and three days are
# indistinguishable within the floor; 1 is kept as the least suppressive of
# three equivalent settings.
earnings_blackout_days = 1

# Shrink a position when the instrument traded unusually heavily. Volume
# against the next day's range measured r=+0.177 at t=+39.03 on shares and
# +24.06 on indices, monotone across all ten deciles -- the quietest fifth of
# share sessions is followed by a 2.28% range and the heaviest by 3.41%.
#
# It shrinks and never grows, because it says nothing about direction: volume
# against the next return is r=-0.013, and a move up on heavy volume is
# followed by *worse* returns than the same move on light volume, so the
# intuition that conviction persists is backwards.
#
# The only risk signal here that works on indices, which file nothing with
# any regulator.
use_volume = true             # was false; same return, a tenth off the drawdown
volume_heavy_ratio = 1.5      # multiples of the 20-day median
volume_heavy_multiplier = 0.6

# Currency. With this off every rate resolves to 1.0 and a $150 share is
# marked at £150.
fx_enabled = true
account_currency = "GBP"
fx_conversion_fee_pct = 0.005

# Confidence a signal must reach to be offered as a trade. Note that the
# environment multiplier is folded into the confidence score and is 0.5 in
# high volatility, so any bar above 0.5 is unreachable on roughly one day in
# three. The dashboard says so when it happens rather than reporting silence.
# Folded into confidence, the environment multiplier caps the score at 0.5
# in high volatility, which makes a 0.60 bar a blackout on roughly one day
# in three rather than a filter. Off, the bar means what it says and the
# environment still scales the size.
environment_in_confidence = false
suggestion_confidence = 0.60

# Halve a position whose conviction has decayed below the level at which it
# would have been opened. Nothing is closed -- the exit band at
# exit_confidence still decides that.
#
# It fills a gap the hysteresis band leaves open. Entry needs 0.35 and exit
# triggers at 0.20, so a position sitting at 0.30 is too weak to open and
# too strong to close, and until now was carried at full size.
#
# Measured by sweeping the cut point over 3.65 years, every arm holding
# genuinely less rather than normalised:
#
#     cut below   CAGR    maxDD   ratio
#       0.30      74.4    -34.4   2.16   inert; the exit band took those
#       0.35      77.4    -29.4   2.64   <- the entry bar
#       0.40      65.5    -34.1   1.92
#       0.50      41.7    -40.9   1.02
#     MIRROR >0.50 35.6   -37.6   0.95   cutting the TOP instead
#
# Single-peaked, monotone collapse above the peak, and the mirror is the
# worst arm of the sweep -- 41.8 points below cutting the bottom. That gap
# is what says this is confidence selecting rather than exposure falling.
#
# The threshold is entry_confidence itself, not a number of its own: the
# swept peak landed on it, which is exactly what the rule means. Changing
# the entry bar moves this with it.
#
# RE-MEASURED (2026-08-31, screen-gated at target 10 on Capital bars
# with measured spreads, baseline 254.9%/-41.4%):
#
#   multiplier    CAGR     maxDD
#   1.0 (off)    263.5%    43.9%
#   0.75         262.4%    41.4%
#   0.5          254.9%    41.4%
#   0.25         250.8%    41.9%
#
# The flattest of the five. Every adjacent step is inside the 8pp floor and
# the whole range spans 12.7pp, so this parameter is close to inert on
# return under the corrected cost model. Turning it off buys 8.6pp for
# 2.5pp of drawdown; both readings are marginal and neither is evidence.
# Left at 0.5 because nothing measured says to move it, which is a weaker
# justification than it had before and is recorded as such.
decayed_position_multiplier = 0.5

# Require a breakout before entering a move, where a trend is running.
#
# A breakout in a trend confirms the move is extending; in a sideways market
# the same event is the textbook false breakout and reverts. Applied only in
# sideways markets it returns 73.0% against 74.4% for no filter -- so the
# requirement is added where there is something to confirm.
#
# Confirmation is required where a move STARTS, not on every re-entry into
# it. Positions close constantly while signals persist (the time stop is
# 0.29 days), and re-gating each re-entry demands evidence for a move
# already confirmed: 63.0% against 78.1%.
#
# Measured through the engine, against a baseline already including the
# decayed-position trim above:
#
#     no gate    73.6%   -30.0%   ratio 2.46   2,671 trades
#      6 bars    79.5%   -26.5%   ratio 3.00   2,588
#     12 bars    80.5%   -26.1%   ratio 3.09   2,579
#     24 bars    80.2%   -26.1%   ratio 3.08   2,576
#     48 bars    80.3%   -26.1%   ratio 3.08   2,577
#
# One point of spread across an eightfold range, drawdown flat, trades within
# twelve. Twelve bars is the middle of that plateau, not a peak -- there is
# no cliff to fall off if the market changes.
#
# RE-MEASURED 2026-08-30 through the engine on Capital bars with measured
# spreads, screen-gated at target 10, entry_size at the signal floor:
#
#   lookback     CAGR    maxDD   Calmar   trades   cost/gross
#          0   120.6%   -43.0%     2.80    4,213        37.3%
#          6   127.3%   -40.1%     3.17    4,004        35.4%
#         12   130.5%   -40.3%     3.24    3,968        34.8%
#         24   133.4%   -40.1%     3.32    3,935        34.1%
#         48   134.6%   -39.9%     3.37    3,931        33.8%
#         96   129.9%   -41.4%     3.14    3,905        33.9%
#
# The gate is worth +9.9pp against no gate at all, above the 8.0pp floor,
# and it lowers drawdown and cost share as well. Twelve is kept: the peak is
# 48, but 12 to 48 spans 4.1pp and everything from 6 to 96 sits within the
# floor of the peak, so twelve remains mid-plateau rather than at an edge.
#
# This RESOLVES a contradiction rather than confirming the old figure. An
# engine sweep earlier the same day measured the gate at -3.9pp -- the
# opposite sign -- on the fixed eight-name book with the size floor still in
# place. Both readings are correct for their configuration and neither
# generalises: the gate only earns its place once the screen is choosing
# from a hundred names and entry_size is not already discarding two thirds
# of the signals. These parameters are not independent, which is why the
# re-measurement queue has to be run against the configuration that now
# exists rather than the one each was originally fitted to.
breakout_lookback = 12

# Charge the spread Capital quoted, not a flat constant.
#
# The bars carry a bid and an ask, and preprocessing already keeps the
# resulting spread_bp panel beside the prices -- so the measured figure was
# sitting at execution time and was not being read. Every backtest this
# project has produced charged 5.0bp round trip instead.
#
# Measured over Capital's full history on the eight-name book:
#
#     ticker    median    vs 5bp        ticker    median    vs 5bp
#     TSLA        4.86     0.97x        AMAT       13.16     2.63x
#     AMD         7.55     1.51x        BKNG       14.94     2.99x
#     CAT        10.51     2.10x        LRCX       15.13     3.03x
#     MU         12.01     2.40x        INTC       28.75     5.75x
#     ALL        11.32     2.26x
#
# Only TSLA is cheaper than the assumption. At the opening hour, which is
# when this strategy deals, every name is worse than its own median.
#
# It matters more here than it would for most books because the median
# position lives about four hours and 80% close within one day. At that
# horizon spread is nearly the entire cost and financing barely registers,
# so halving the spread charge understates the whole strategy rather than
# one line of it.
use_measured_spreads = true

# Take no signal action on the first bar of a session.
#
# OFF, and it was briefly on. The case for it was that entries on the first
# bar of a session won 44.2% against 51.9% everywhere else (t=-2.26,
# p=0.025), and that the backtest returned 126.4% against 120.2%.
#
# Both numbers were computed while every dollar instrument was being marked
# at an exchange rate of 1.0 -- the conversion pairs were named in the rate
# map and absent from the lake, so a $150 share was marked at £150. Re-run
# with the rate attached, the trip-level finding falls to t=-1.63, p=0.104,
# and the rule costs 1.1pp of CAGR (138.7% against 139.8%).
#
# So it is off. The code stays, tested and documented, because the effect
# may be real and merely too small to see in two years of one regime -- but
# a rule shipped on evidence that turned out to be an artefact has no claim
# to stay on while it is re-earned.
#
# The defence against a stale decision at the open is now the last look in
# advisor/livecheck.py, which re-evaluates the signal against the live price
# before opening. That one survives the correction: t=+4.18, p=0.000038.
hold_across_session_open = false

# --------------------------------------------------------------------------- #
# The universe screen
# --------------------------------------------------------------------------- #
#
# The pool the screen ranks, and the sector map it caps concentration by.
#
# This is the screen's one remaining judgement call, and it is here so that
# it stays visible. Selecting mechanically from a hand-drawn list moves the
# bias rather than removing it; what it buys is that the selection *within*
# the pool is reproducible, and that the pool is one list somebody can argue
# with rather than nineteen decisions nobody wrote down.
#
# It lived in a scratch script until 2026-08-27, which meant every screen
# this project had run was reproducible only by whoever still had the file.
# That is the same defect the screen exists to fix, one level up.
#
# An instrument here is one the screen MAY RANK, not one it will hold. The
# traded universe is `market.tickers` and changing it stays a human act:
# `cfdinvest-universe screen` reports the difference and records it, and
# never edits this file.
#
# Known bias, stated rather than hidden: the pool is US large caps that are
# large *now*, so it is drawn with hindsight. Screening within it is
# reproducible; the pool itself is not a measurement.

[universe]
# Trade the screen's latest recorded selection rather than market.tickers.
# Switched on 2026-08-29 by the owner, the intention being full automation
# on live data.
#
# market.tickers is still never rewritten -- it stays as the fallback and as
# the record of what a person last chose. The selection is read from
# selections.jsonl, which the screen has been appending to all along.
#
# The screen runs daily, so the traded list tracks conditions rather than
# lagging them by up to a month. A name that leaves the list is not closed:
# it keeps its signals and exits on its own reversal or time stop, and is
# simply not re-entered. See universe/README.md.
follow_screen = true

# How many instruments to hold -- COMPUTED, not set.
#
# `target` is left unset deliberately so the number is derived at each
# screen from the curve below, read through the noise floor. On the
# 2026-08-30 measurement that gives twelve: eight, ten and twelve are
# statistically indistinguishable (the noise floor is 14.6pp, measured by
# changing only the day of the month a screen runs on), and
# `size_preference = "largest"` takes the top of that band because the
# owner's objective is maximum growth.
#
# This is also the OPEN POSITION CAP, and deliberately the same number.
# Every name eligible but unheld is a candidate to rotate into, and each
# rotation pays a round trip: a pool of 100 with 10 slots destroys the
# account on 44,383 trades while the screen itself contributes no churn at
# all. So `max_open_positions` stays unset and this is the only capacity
# control.
#
# Set `target` explicitly only to pin the answer against the measurement.
size_preference = "largest"

# Measured CAGR by universe size, 2026-08-30: 3.65 years, daily screening,
# per-bar spreads, run-out semantics. Data, not configuration -- replaced
# when the sweep is re-run rather than tuned. There is no optimum in it:
# 2023 wants ten, 2024 four, 2025 sixteen, 2026 twenty. What eight-to-twelve
# has is no losing year at any size in the band, worst year +8% to +15%,
# while sixteen and above lose 23% to 40% in 2024.

# Ninety-nine names, from 2026-08-29. Chosen by a rule rather than by
# hand: every US large cap Capital will deal, ranked by median daily
# turnover over the trailing year, top hundred.
#
# LIN is replaced by DUK, the next name down. Capital quotes LIN too
# patchily to measure -- 376 distinct days inside a 1,333-day span, 42%
# coverage -- while DUK reaches 96%. That is a data-availability
# substitution rather than a judgement about the instrument, and it is
# recorded because a hole in the list would otherwise look like a rule
# with an exception.
#
# The previous forty-nine were picked in 2026 knowing which had prospered,
# and that showed up everywhere -- concentrating into them amplified the
# hindsight rather than diluting it, and monthly reselection amplified it
# further, producing a backtest whose worst rolling year was +51%.
# Turnover is computable from data available at the time and knows nothing
# about outcomes.
#
# Two effects beyond honesty, both measured. The pool spans seven sectors
# where the old one was 22 of 49 technology, and the screen's own picks
# were entirely technology -- which matters because technology measured
# *worst* on direction predictability (0.496 against 0.528 for consumer).
# And it gives the short side something to work with: on the wider pool
# 41.8% of exposure is short against 16.4% on the eight-name book, because
# the old universe contained almost nothing that fell. Shorts earned
# 39,284 against longs' 49,213 over 3.65 years.
#
# It does not remove survivorship entirely -- these are large caps *today*,
# so companies that shrank out of the set are absent. That residue needs
# historical index membership, which is a paid data problem. It takes the
# bias from "we chose 49 knowing which won" to "we used a turnover rule",
# which is a different order of magnitude.
#
# Fixed size deliberately. Re-running the same turnover rule refreshes it;
# it does not grow.

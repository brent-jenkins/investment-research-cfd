# How many the screen selects. Unset means "as many as are traded", so the
# screen answers "which twenty" rather than inventing a number of its own.
# An explicit target, which wins over the size curve.
#
# Set to 25 on 2026-09-04, and deliberately NOT to the curve's peak of 70.
# The curve is a return measurement and the engine does not model the
# broker's minimum deal size; the dealing path does. At 70 names on this
# balance each position is about 136 of notional, and 0.1 units -- the
# minimum -- is 100 on MU and 114 on LLY, so the expensive names would round
# to the floor and the intended weights would be badly distorted. At 25 each
# position is about 381, comfortably above the granularity.
#
# So this is the viability ceiling the resolver's docstring describes and
# cannot yet compute, applied by hand until it can. It is a fact about the
# account's SIZE rather than about the strategy, and it should rise as the
# balance does.
# Held at 10 -- the size actually in force -- rather than at the curve's
# peak of 70, and NOT left to the curve.
#
# The curve above is now honest and points at 70, but the engine does not
# model the broker's minimum deal size and the dealing path does. At 70 names
# on this balance each position is about 136 of notional, against a 0.1-unit
# minimum worth 100 on MU and 114 on LLY, so the expensive names would round
# to the floor and the weights would be distorted. About 25 is what this
# balance can actually deal.
#
# The right mechanism already exists and is one wire short of working:
# `risk.capacity.position_capacity` computes slots from a balance and the
# brokers minimum sizes, `operating_size` accepts it as a ceiling, and
# `universe.resolve_target` passes `ceiling=None` with a comment saying the
# dealing path should supply it. Wiring that makes this value rise on its own
# as the balance grows, which is better than any constant.
#
# Pinned meanwhile so the size curve can be recorded truthfully without
# silently changing what the account holds.
# Unset: the size curve chooses, bounded by two ceilings.
#
# `universe.max_target` stops the curve selecting the whole candidate pool.
# It is 25, set in cfdinvest/config.py -- this file never assigns it, and a
# comment here previously said 70, which was the intermediate decision
# written down and not revised when it landed at 25.
#
# It matters more than it did. Re-measured on 2026-09-07 the size curve is
# MONOTONE to 100 with no peak, so "largest within the floor" now selects the
# entire hundred-name pool rather than the 70 the old curve implied. Nothing
# in the return curve argues for a stop any more, and drawdown does not argue
# for one either -- 6.6% to 7.6% across the whole range with no trend.
#
# The VIABILITY ceiling is meant to bind below that on a small account:
# computed by `universe._viability_ceiling` from the balance recorded in
# persist.margin and the minimum deal sizes in persist.spreads, requiring
# every slot to be worth several minimum tickets, and rising on its own as
# the balance does.
#
# **`position_capacity` does not bind, and the reason is worse than being
# optimistic.** It is optimistic -- it sizes against `max_leverage` 3.5x
# where the book runs about 1.3x, and takes the ninetieth-percentile minimum
# ticket rather than one it might actually be handed, computing 83 slots on
# the recorded balance. But the premise is the real problem: it caps how many
# names may be ELIGIBLE by how many SIMULTANEOUS positions the balance can
# fund, and those are different quantities. At target 100 the book holds a
# median of THREE positions and is flat on 42.6% of bars, so the two differ
# by a factor of thirty.
#
# Measured with the engine applying the real increments, nothing is refused
# for being too small at any balance down to 1,000. So this constant is not
# holding back a book the account cannot fund; it is holding back one nobody
# has decided to run yet, which is a different and more honest reason to
# keep it.
#
# Pin an explicit value here only to override both.
# target = 25


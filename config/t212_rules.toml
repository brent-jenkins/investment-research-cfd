# NOTE ON MINIMUMS: min_quantity (units) and min_trade_value (account
# currency) both vary by instrument type and must be read per instrument.
# Shares, index CFDs, FX pairs and commodity futures are quoted in
# different units, so a floor from one says nothing about another. Only
# LULU has been read so far; every other instrument reports these as
# unverified, which is the correct answer rather than a gap.


# GOLDF (futures) rather than XAUUSD (spot), decided on the numbers.
# Spot charges 15.0% a year to hold long against the future's 4.01% -- £45
# more per 30 days on £5,000. The future costs 1 point more to short, which
# does not come close to offsetting it.
#
# It also matches what the lake prices: GC=F is front-month COMEX futures.
# The cost is an expiry to roll through, which nothing here models yet --
# worth a warning before a position runs into one.


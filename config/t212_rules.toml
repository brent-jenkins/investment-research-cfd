# The twentieth instrument, and the only one outside technology added on
# purpose. The screen ranked MU top of the candidates, but MU had returned
# +855% in two years and turnover is price x volume -- so its liquidity score
# was largely the run itself, which is the residual bias the screen's README
# admits to. CAT scored +0.257, mid-pack among names already held, and is the
# only non-technology name in the top group. Twelve of nineteen were already
# technology; a thirteenth would have made the concentration worse, and
# diversification is what bought the -19.6% drawdown that beat every tighter
# configuration tested.

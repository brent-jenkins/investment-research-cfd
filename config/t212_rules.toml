# Searching Trading 212 for "COST" returns Costain first: a UK construction
# firm on the LSE, priced in GBP with no FX fee. The lake's COST is Costco
# Wholesale on the NYSE, which is what every price, signal and backtest
# figure under this ticker was computed from.
#
# One set of terms was recorded here from that search before the collision
# was spotted. Worth keeping in mind for any instrument added later: the
# symbol matching is not the confirmation, the company name is. Two firms
# sharing a symbol attaches the trading terms of one to the prices of the
# other, and the resulting suggestion names the right size, the right stop
# and the wrong company.


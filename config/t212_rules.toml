# Trading 212 instrument rules — the live table.
#
# This is the file the safety engine reads. Anything recorded here is
# treated as CHECKED; anything absent is reported "unverified", never
# assumed. Nothing in this project invents a broker number.
#
# FIELDS, and the two that are easy to get wrong:
#
#   t212_name           what the app calls it -- overrides the built-in guess
#   leverage            e.g. 20.0 for 20:1
#   financing_daily_pct the overnight fee AS THE APP SHOWS IT, %/day.
#                       0.0083 means 0.0083%/day = 3.03%/year. Do NOT put a
#                       daily figure in `financing_rate`, which is annual --
#                       that is wrong by ~4,000x and looks plausible.
#   fx_fee_applies      whether the 0.5% conversion is charged on the result.
#                       RECORD IT, do not infer: USA 500 is funded in GBP and
#                       charges it; UK 100 is funded in GBP and does not.
#   spread_typical      indicative only -- the live spread moves constantly
#   currency            what the instrument is really priced in
#   expiry              dated contracts only, e.g. "2026-09-17"
#   available = false   Trading 212 does not offer it; stops it being suggested
#

# EXTENDED HOURS, and why nothing reads it
#
# `extended_hours` says whether Trading 212 offers the instrument outside the
# exchange's regular session. It carries its own source line because it was
# read on a different day from the rest of each entry, and dating a fact to a
# reading that never covered it is the small kind of lie this table exists to
# stop.
#
# It supersedes a partial reading taken earlier the same day, which had GOOGL
# as available and NKE as not; the complete pass reversed both. The partial
# values are gone rather than annotated -- this file is configuration and says
# what is true now -- so the correction is recorded here instead.
#
# One caveat on the earlier reading, because the two are not in conflict:
# it was taken by watching which instruments were *open at 12:59 UTC*, and
# NKE was not. "Offers extended hours" and "is trading at this minute" are
# different questions, and the sessions do not all start together.
#
# NOTHING TRADES ON IT, and both halves of the reason are now measured.
#
# No edge: 6,397 signals held into an overnight gap moved the right way 49.4%
# of the time (mean +0.024%, t=+0.89, p=0.375), and no confidence band did
# better.
#
# And a real cost. Measured on Capital.com on 2026-08-27, the same twenty
# instruments an hour apart either side of the 20:00 close: the spread
# widened on nineteen of twenty, by a median of 1.85x. JNJ went from 5.6bp
# to 83.3bp, XOM 7.7 to 52.9, JPM 3.4 to 24.3. Only TSLA tightened, which is
# the one name with real after-hours volume. Against a break-even near 6bp
# of friction that is decisive.
#
# Owner's decision, 2026-08-27: trade the regular session only. This had
# been my recommendation on one measurement and one assumption; the
# assumption is now the measurement.


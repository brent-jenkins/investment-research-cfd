# Streamlit's own theme, in both modes.
#
# Expressed as [theme.light] and [theme.dark] rather than one flat palette,
# which matters for a reason worth recording: a single custom theme replaces
# Streamlit's light/dark switch with "Custom" and nothing else, so branding
# the app cost the reader any way to choose. The sub-theme form brands both
# modes and leaves the switch working, which is what was wanted all along --
# we had been working around Streamlit's theming instead of using it.
#
# The values come from cfdinvest/ui/theme.py PALETTES, and a test asserts
# they still match. Two places holding one colour is how a wordmark ends up
# a different blue from the buttons beside it.

[theme]
# The brand blue, identical in both modes. It is the one colour that does
# not bend to the contrast rule, because a wordmark that changes colour
# between light and dark is no longer a wordmark.
primaryColor = "#00C2FF"

[theme.dark]
backgroundColor = "#0B0C10"
secondaryBackgroundColor = "#1F2833"
textColor = "#C5C6C7"
linkColor = "#66FCF1"

[theme.light]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F6"
# The dark palette's panel colour promoted to text: the same brand navy,
# now carrying the contrast instead of the background.
textColor = "#1F2833"
# #66FCF1 fails badly on white, so light mode keeps the hue and drops the
# luminance until it passes.
linkColor = "#0E7C77"

[server]
# Load-bearing in deployment: without it Streamlit binds every interface and
# answers past the reverse proxy. Set here as well as on the command line so
# a local run cannot accidentally expose itself either.
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false

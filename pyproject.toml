[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdinvest"
version = "0.1.0"
description = "Multi-asset CFD backtesting engine"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# PINNED, not floors, since 2026-09-12.
#
# Floors meant every install drifted on its own, and production drifted
# AHEAD of the machine the tests run on: on 2026-09-08 prod had pandas
# 3.0.5, pyarrow 25.0.1, streamlit 1.62.0 and yfinance 1.6.0 against dev's
# 3.0.3, 24.0.0, 1.58.0 and 1.4.1. A suite that passes on one set of
# libraries, guarding an account that runs on another, is this project's own
# recurring failure wearing different clothes: the thing measured is not the
# thing that runs.
#
# Pinned to what PRODUCTION already runs rather than to what dev ran. Those
# versions have been exercised against the real lake and the real broker for
# weeks; dev's have not. Moving prod backwards to match dev would be
# changing the thing that works to match the thing that does not.
#
# Raising a pin is now a deliberate commit that runs the suite, which is the
# point.
dependencies = [
    "pandas==3.0.5",
    "numpy==2.4.6",
    "pyarrow==25.0.1",
    "requests==2.34.2",
    "yfinance==1.6.0",
    # The headline-event experiment (CLAUDE.md, 2026-09-30). Imported only by
    # `ingestion.headline_labels`, and only when a key is present; removed
    # with that module if the experiment ends on a null.
    "anthropic==1.9.0",
]

[project.scripts]
cfdinvest-analytics = "cfdinvest.analytics.cli:main"
cfdinvest-helper = "cfdinvest.livehelper.cli:main"
cfdinvest-confirm = "cfdinvest.confirm.cli:main"
cfdinvest-schedule = "cfdinvest.schedule.app:main"
cfdinvest-universe = "cfdinvest.universe.cli:main"

[project.optional-dependencies]
# The dashboard is optional: nothing in the pipeline imports it.
ui = ["streamlit==1.62.0"]
# CPU and memory readings for the monitoring layer. Kept OPTIONAL rather than
# promoted to a hard dependency, because `monitoring/resources.py` is written
# to work without it and to report the absence rather than assume health --
# "absent is not the same as healthy" is its own wording, and that stays true
# for anyone importing the library.
#
# The DEPLOYMENT installs it, which is a different decision from the library
# requiring it. Memory was the failure mode twice -- the 2026-09-09 throttle
# and the 2026-09-11 stall -- and the analysis now runs inside a 2G unit, so
# the one blind spot left in the alarm is the one that already cost two
# sessions.
monitoring = ["psutil==7.2.2"]
# pytest-cov is a development tool, not a runtime dependency: the suite runs
# without it and only `--cov` needs it.
dev = ["pytest>=8.0", "pytest-mock>=3.12", "pytest-cov>=5", "streamlit==1.62.0"]

[tool.setuptools.packages.find]
include = ["cfdinvest*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdinvest"
version = "0.1.0"
description = "Multi-asset CFD backtesting engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "requests>=2.31",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
# The dashboard is optional: nothing in the pipeline imports it.
ui = ["streamlit>=1.49"]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "streamlit>=1.49"]

[tool.setuptools.packages.find]
include = ["cfdinvest*"]
